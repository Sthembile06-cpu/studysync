<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudySync</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav>
        <div class="nav-brand">
            <img src="../assets/images/StudySync1.png" alt="logo" class="hero-logo">
        </div>
        
        <ul class="nav-links">
            <li><a href="../index.html#features">Features</a></li>
            <li><a href="../index.html#how-it-works">How It Works</a></li>
            <li><a href="../index.html#why-studysync">Why StudySync</a></li>
            <li><a href="login.html" class="nav-login">Log In</a></li>
            <li><a href="login.html" class="nav-signup">Sign Up</a></li>
        </ul>
    </nav>

    <section id="auth">
    <div class="auth-container">

        <!-- LOGIN FORM -->
        <div class="auth-card" id="login-form">
            <h2>Welcome back</h2>
            <p class="section-subtext">Log in to continue your study journey</p>

            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password">
            </div>

            <button type="button" class="auth-btn">Log In</button>

            <p class="auth-switch">Don't have an account? 
                <span onclick="showSignup()">Sign Up</span>
            </p>
        </div>

        <!-- SIGNUP FORM -->
        <div class="auth-card" id="signup-form" style="display:none;">
            <h2>Create your account</h2>
            <p class="section-subtext">Start your focus journey today</p>

            <div class="form-group">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Create a password">
            </div>

            <div class="form-group">
                <label for="signup-confirm">Confirm Password</label>
                <input type="password" id="signup-confirm" placeholder="Confirm your password">
            </div>

            <button type="button" class="auth-btn">Create Account</button>

            <p class="auth-switch">Already have an account? 
                <span onclick="showLogin()">Log In</span>
            </p>
        </div>

    </div>
</section>
</body>
<script src="../js/auth.js"></script>
</html>
