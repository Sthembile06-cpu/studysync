<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode - StudySync</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="focus-body">

    <div class="focus-container">

        <div class="focus-topbar">
            <span class="focus-logo">StudySync</span>
            <span class="focus-cycle">Cycle 1 of 3</span>
            <button type="button" class="focus-exit-btn">✕ Exit</button>
        </div>

        <div class="focus-timer-section">
            <p class="focus-mode-label" id="focus-mode-label">FOCUS SESSION</p>
            <div class="focus-timer-ring">
                <span class="focus-timer-display" id="timer-display">25:00</span>
            </div>
            <div class="focus-progress-bar">
                <div class="focus-progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <p class="focus-quote" id="focus-quote">"The secret of getting ahead is getting started."</p>

        <div class="focus-controls">
            <button type="button" id="pause-btn">⏸ Pause</button>
            <button type="button" id="skip-btn">⏭ Skip</button>
            <button type="button" id="end-btn">⏹ End Session</button>
        </div>

        <p class="focus-sound" id="sound-indicator">🌧️ Rain ambience playing</p>

    </div>
    
<script src="../js/focus.js"></script>
</body>
</html>
